*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

:root{
  --paper:#E8E9E2;
  --card:#F7F7F2;
  --card-2:#EFF0E8;
  --ink:#22241E;
  --ink-2:#5E6156;
  --ink-3:#8B8E80;
  --rule:#D3D5C8;
  --rule-2:#C2C4B5;
  --accent:#8C2F39;
  --accent-2:#A94651;
  --accent-soft:rgba(140,47,57,.10);
  --blue:#2E4A63;
  --blue-soft:rgba(46,74,99,.10);
  --good:#41684A;
  --good-soft:rgba(65,104,74,.12);
  --warn:#96691A;
  --shadow:0 1px 0 rgba(34,36,30,.05),0 6px 18px -12px rgba(34,36,30,.45);
  --d0:#6F8A72;
  --d1:#8E9463;
  --d2:#A98A3D;

    --card:#1F2019;
    --card-2:#272820;

    --rule:#33352B;
    --rule-2:#42443A;
    --accent:#DB7B84;
    --accent-2:#E9959D;
    --accent-soft:rgba(219,123,132,.14);
    --blue:#8EB1CD;
    --blue-soft:rgba(142,177,205,.13);
    --good:#8FBB95;
    --good-soft:rgba(143,187,149,.15);
    --warn:#D3A75C;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.9);
    --d0:#7FA184;
    --d1:#A3AA72;
    --d2:#C3A055;

:root[data-theme="dark"]{
  --paper:#16170F;
  --card:#1F2019;
  --card-2:#272820;
  --ink:#E7E8DC;
  --ink-2:#A7A99A;
  --ink-3:#787A6C;
  --rule:#33352B;
  --rule-2:#42443A;
  --accent:#DB7B84;
  --accent-2:#E9959D;
  --accent-soft:rgba(219,123,132,.14);
  --blue:#8EB1CD;
  --blue-soft:rgba(142,177,205,.13);
  --good:#8FBB95;
  --good-soft:rgba(143,187,149,.15);
  --warn:#D3A75C;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.9);

  --d1:#A3AA72;
  --d2:#C3A055;
  --d3:#C97C4A;

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px 96px}

/* ---------- masthead ---------- */
.masthead{padding:56px 0 28px;border-bottom:1px solid var(--rule)}
.eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 14px
}
h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(2.6rem,7vw,4.4rem);line-height:.98;letter-spacing:-.02em;
  margin:0;text-wrap:balance
}
h1 .em{font-style:italic;font-weight:500;color:var(--accent)}
.tagline{
  max-width:46ch;margin:16px 0 0;color:var(--ink-2);font-size:1.05rem
}

.ledger{
  display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  margin:30px 0 0
}
.stat{background:var(--card);padding:14px 16px}
.stat dt{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);margin:0
}
.stat dd{
  margin:5px 0 0;font-family:var(--font-display);font-weight:700;
  font-size:1.85rem;line-height:1;font-variant-numeric:tabular-nums
}
.stat dd small{font-size:.9rem;font-family:var(--font-body);font-weight:400;color:var(--ink-3)}
.stat.is-grim dd{color:var(--accent)}

/* ---------- notices ---------- */
.notice{
  margin:22px 0 0;padding:12px 14px;border:1px solid var(--rule-2);
  border-left:3px solid var(--blue);background:var(--blue-soft);
  font-size:.9rem;color:var(--ink-2)
}
.notice strong{color:var(--ink)}
.notice.warn{border-left-color:var(--accent);background:var(--accent-soft)}

/* ---------- intake ---------- */
.slip{
  margin:34px 0 0;border:1px solid var(--rule-2);background:var(--card);
  box-shadow:var(--shadow)
}
.slip-head{
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;
  padding:14px 18px;border-bottom:1px dashed var(--rule-2);background:var(--card-2)
}
.slip-head h2{
  font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em
}
.slip-head .hint{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.slip-body{display:grid;grid-template-columns:1fr;gap:22px;padding:18px}
@media (min-width:860px){.slip-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}}

label.f{display:block;margin:0 0 14px}
label.f > span{
  display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 5px
}
input[type=text],textarea,select{
  width:100%;background:var(--paper);border:1px solid var(--rule-2);
  border-radius:0;padding:9px 11px;font-size:.95rem;color:var(--ink)
}
textarea{resize:vertical;min-height:132px;line-height:1.5;font-family:var(--font-body)}
@media (min-width:860px){textarea{min-height:300px}}
input[type=text]:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;border-radius:0;
  transition:transform .12s ease,background .12s ease
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{border-color:var(--ink);background:var(--card-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#FFF7F5}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}

.parse-note{
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);
  margin:0 0 12px;min-height:1.2em
}
.parse-note.hit{color:var(--good)}
.parse-note.miss{color:var(--accent)}

.sig{
  display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;
  border-top:1px dashed var(--rule-2)
}
.sig span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.sig input{max-width:220px;padding:5px 9px;font-size:.88rem}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  margin:42px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--rule)
}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{
  cursor:pointer;background:transparent;border:1px solid transparent;
  padding:5px 11px;font-family:var(--font-mono);font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--rule-2);background:var(--card)}
.tab b{font-weight:400;opacity:.65;margin-left:5px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input[type=text]{width:190px;padding:6px 10px;font-size:.88rem}
.tools select{width:auto;padding:6px 10px;font-size:.88rem}

.cats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.catbtn{
  cursor:pointer;background:transparent;border:1px solid var(--rule-2);
  padding:3px 10px;font-family:var(--font-mono);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)
}
.catbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- board ---------- */
.board{
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  align-items:start
}
.card{
  position:relative;display:flex;background:var(--card);
  border:1px solid var(--rule-2);box-shadow:var(--shadow);overflow:hidden
}
.decay{width:5px;flex:0 0 5px;background:var(--d0)}
.card[data-decay="1"] .decay{background:var(--d1)}
.card[data-decay="2"] .decay{background:var(--d2)}
.card[data-decay="3"] .decay{background:var(--d3)}
.card[data-decay="4"] .decay{background:var(--d4)}
.card[data-decay="3"]::after,.card[data-decay="4"]::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(58deg,transparent 0 7px,var(--ink-3) 7px 8px);
  opacity:.05
}
.card-in{flex:1 1 auto;min-width:0;padding:14px 16px 13px;display:flex;flex-direction:column;gap:9px}
.card-top{display:flex;align-items:center;gap:9px;justify-content:space-between}
.chip{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid var(--rule-2);padding:2px 7px;color:var(--ink-2);white-space:nowrap
}
.age{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.card[data-decay="4"] .age{color:var(--accent)}
.card h3{
  font-family:var(--font-display);font-weight:700;font-size:1.16rem;line-height:1.22;
  margin:0;letter-spacing:-.01em;overflow-wrap:anywhere
}
.card h3 a{color:inherit;text-decoration:none;background-image:linear-gradient(var(--rule-2),var(--rule-2));background-size:100% 1px;background-repeat:no-repeat;background-position:0 100%}
.card h3 a:hover{background-image:linear-gradient(var(--accent),var(--accent))}
.note{margin:0;font-size:.9rem;color:var(--ink-2);overflow-wrap:anywhere}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.facts li{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);overflow-wrap:anywhere}
.facts li i{font-style:normal;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-size:10px;margin-right:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.src{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue-soft);align-self:flex-start
}
.src:hover{border-bottom-color:var(--blue)}
.card-foot{
  margin-top:auto;padding-top:11px;border-top:1px dashed var(--rule-2);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between
}
.by{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.acts{display:flex;flex-wrap:wrap;gap:4px}
.act{
  cursor:pointer;background:transparent;border:1px solid transparent;
  padding:3px 7px;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)
}
.act:hover{color:var(--ink);border-color:var(--rule-2)}
.act.yes:hover{color:var(--good);border-color:var(--good)}
.act.no:hover{color:var(--accent);border-color:var(--accent)}
.act[aria-pressed="true"]{color:var(--blue);border-color:var(--blue)}

.card[data-status="done"]{background:var(--good-soft)}
.card[data-status="done"] .decay{background:var(--good)}
.card[data-status="done"] h3{text-decoration:line-through;text-decoration-color:var(--ink-3);text-decoration-thickness:1px}
.card[data-status="dropped"]{opacity:.6}
.card[data-status="dropped"] .decay{background:var(--ink-3)}
.card[data-status="dropped"] h3{text-decoration:line-through;text-decoration-color:var(--ink-3)}

/* stamped cards reserve a band at the top so the stamp never sits on the title */
.card[data-status="done"] .card-in,
.card[data-status="dropped"] .card-in{padding-top:46px}
.stamp{
  position:absolute;top:13px;right:12px;z-index:2;pointer-events:none;
  font-family:var(--font-mono);font-weight:700;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--good);border:2px solid var(--good);
  padding:3px 9px;transform:rotate(-9deg);opacity:.85;background:var(--card)
}
.stamp.let-go{color:var(--ink-3);border-color:var(--ink-3)}
@keyframes slam{
  0%{transform:rotate(-24deg) scale(2.6);opacity:0}
  60%{transform:rotate(-9deg) scale(1);opacity:.95}
  75%{transform:rotate(-9deg) scale(1.06)}
  100%{transform:rotate(-9deg) scale(1);opacity:.85}
}
.stamp.slam{animation:slam .45s cubic-bezier(.2,.9,.3,1) both}

.empty{
  border:1px dashed var(--rule-2);padding:44px 24px;text-align:center;color:var(--ink-2)
}
.empty p{margin:0 0 6px}
.empty .big{font-family:var(--font-display);font-size:1.3rem;color:var(--ink);font-style:italic}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--paper);padding:10px 18px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.6);max-width:min(92vw,520px);text-align:center
}
.toast[hidden]{display:none}

footer.foot{
  margin:60px 0 0;padding-top:20px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em
}
.foot a{color:var(--ink-3)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>

<script id="app-script">
(function(){

/* ===================== constants ===================== */

var TITLE = "The Someday List";
var FONT_LINKS =
  '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +

var CATEGORIES = [
  {key:"eat",     label:"Eat",      words:["restaurant","food","eat","brunch","dinner","lunch","taco","ramen","pizza","bakery","dessert","cafe","café","coffee","omakase","bbq","noodle","dumpling","breakfast","pastry","sandwich","burger","sushi","dim sum","michelin","bistro","diner","hotpot","pho","banh mi","gelato","croissant"]},
  {key:"drink",   label:"Drink",    words:["bar","cocktail","drink","wine","beer","brewery","speakeasy","happy hour","distillery","pub","tasting","mezcal","whisky","whiskey","rooftop","natural wine","sake"]},
  {key:"outdoors",label:"Outdoors", words:["hike","hiking","trail","beach","park","camp","camping","waterfall","sunrise","sunset","kayak","swim","lake","mountain","island","snorkel","surf","bike","cycling","picnic","garden","hot spring","stargaz","canyon","dive","paddle"]},

  {key:"move",    label:"Move",     words:["climbing","bouldering","yoga","pilates","run","marathon","gym","dance","tennis","pickleball","padel","skate","ski","snowboard","boxing","muay thai","spin"]},
  {key:"make",    label:"Make",     words:["workshop","pottery","ceramics","course","diy","craft","painting","cooking class","candle","printmaking","photography walk","knit","woodwork"]}
];
var CAT_LABEL = {};
CATEGORIES.forEach(function(c){ CAT_LABEL[c.key] = c.label; });
CAT_LABEL[""] = "Unsorted";

var DECAY = [
  {max:6,   tier:0, word:"still warm"},
  {max:29,  tier:1, word:"cooling off"},
  {max:89,  tier:2, word:"gathering dust"},
  {max:179, tier:3, word:"fossilising"},
  {max:1e9, tier:4, word:"archaeological"}
];

var DAY = 86400000;

/* ===================== state ===================== */

var STATE = {v:1, items:[], savedAt:0};
var MODE = "local";          /* "artifact" once the capability answers */
var API = null;              /* artifact namespace */
var DL = null;               /* downloads namespace */
var READONLY = false;

/* per-viewer, never shared */

  tab: "someday",

function lsGet(k,d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function myName(){ return (lsGet("sl.name","") || "").trim(); }

/* ===================== helpers ===================== */

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function attr(s){ return esc(s); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function daysSince(ts){ return Math.max(0, Math.floor((Date.now() - ts) / DAY)); }
function decayOf(days){
  for(var i=0;i<DECAY.length;i++){ if(days <= DECAY[i].max) return DECAY[i]; }
  return DECAY[DECAY.length-1];
}
function plural(n,one,many){ return n === 1 ? one : many; }
function safeUrl(u){
  u = String(u||"").trim();
  return /^https?:\/\//i.test(u) ? u : "";
}
function hostOf(u){
  try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; }
}

/* ===================== the paste reader ===================== */

function detectSource(url){
  var h = hostOf(url);
  if(!h) return "";
  if(/instagram\.com$/.test(h)) return "Instagram";
  if(/tiktok\.com$/.test(h)) return "TikTok";
  if(/(youtube\.com|youtu\.be)$/.test(h)) return "YouTube";
  if(/(google\.[a-z.]+|goo\.gl)$/.test(h) && /maps/.test(url)) return "Maps";
  if(/reddit\.com$/.test(h)) return "Reddit";
  if(/(twitter\.com|x\.com)$/.test(h)) return "X";
  if(/facebook\.com$/.test(h)) return "Facebook";
  return h;
}

function igShortcode(url){
  var m = /instagram\.com\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i.exec(url||"");
  return m ? m[1] : "";
}

var STOP_TITLE = /^(link in bio|follow for more|save this|save for later|tag someone|comment below|credit|via|photo by|\u{1F4CD})/iu;

function parsePaste(raw){

  var text = String(raw||"").replace(/\r/g,"").trim();
  if(!text) return out;

  /* 1. links */
  var urls = text.match(/https?:\/\/[^\s<>"')\]]+/gi) || [];
  if(urls.length){
    out.url = urls[0].replace(/[.,;:)\]]+$/,"");
    out.source = detectSource(out.url);
  }
  var body = text;
  urls.forEach(function(u){ body = body.split(u).join(" "); });

  /* 2. hashtags become tags, then leave the prose */
  var tags = body.match(/#[\p{L}\p{N}_]+/gu) || [];
  var seen = {};
  tags.forEach(function(t){
    var k = t.slice(1).toLowerCase();
    if(k.length > 1 && !seen[k]){ seen[k] = 1; out.tags.push(k); }
  });
  out.tags = out.tags.slice(0,6);
  body = body.replace(/#[\p{L}\p{N}_]+/gu," ");

  /* 3. place — a pin emoji wins, then "at Somewhere", then "in Somewhere" */
  var m = /\u{1F4CD}\s*([^\n|·•]{2,60})/u.exec(body);
  if(m){ out.place = m[1].trim(); }
  if(!out.place){
    m = /\bat\s+((?:[A-Z][\w'&.’-]*)(?:\s+(?:[A-Z][\w'&.’-]*|de|la|el|of|the|and)){0,4})/.exec(body);
    if(m) out.place = m[1].trim();
  }
  if(!out.place){
    m = /\bin\s+((?:[A-Z][\w'’-]*)(?:\s+[A-Z][\w'’-]*){0,2})/.exec(body);
    if(m) out.place = m[1].trim();
  }
  out.place = out.place.replace(/[\s,.;:|-]+$/,"");

  /* 4. cost */
  if(/\b(free entry|free admission|no cover|free)\b/i.test(body)){ out.cost = "Free"; }
  m = /\$\s?\d[\d,]*(?:\.\d{2})?(?:\s?[-–]\s?\$?\s?\d[\d,]*(?:\.\d{2})?)?/.exec(body);
  if(m){ out.cost = m[0].replace(/\s+/g,""); }

  /* 5. a date hint, if the caption bothered to give one */
  var MON = "jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec";
  m = new RegExp("\\b(?:until|through|till|til|from|on|opens?|closes?)?\\s?\\b(" + MON + ")[a-z]*\\.?\\s+\\d{1,2}(?:\\s*[-–]\\s*\\d{1,2})?\\b","i").exec(body);
  if(m){ out.when = m[0].trim().replace(/^\w/,function(c){ return c.toUpperCase(); }); }
  if(!out.when){
    m = /\b(this|next)\s+(weekend|week|month|summer|winter|spring|autumn|fall)\b/i.exec(body);
    if(m) out.when = m[0];
  }

  /* 6. category by keyword weight */
  var hay = (body + " " + out.tags.join(" ")).toLowerCase();
  var best = "", bestScore = 0;
  CATEGORIES.forEach(function(c){
    var score = 0;
    c.words.forEach(function(w){
      var re = new RegExp("(^|[^a-z])" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "([^a-z]|$)","i");
      if(re.test(hay)) score++;
    });
    if(score > bestScore){ bestScore = score; best = c.key; }
  });
  out.category = best;

  /* 7. title — first line that reads like a name for the thing */
  var lines = body.split("\n").map(function(l){
    return l.replace(/^[\s•·\-–*_]+/,"").replace(/\s+/g," ").trim();
  }).filter(Boolean);

  for(var i=0;i<lines.length;i++){
    var l = lines[i];
    var stripped = l.replace(/^[\p{Extended_Pictographic}️‍\s]+/u,"").trim();
    if(stripped.length < 3) continue;
    if(STOP_TITLE.test(stripped)) continue;
    if(out.cost && stripped === out.cost) continue;
    out.title = stripped;
    lines.splice(i,1);
    break;
  }
  if(!out.title){
    if(out.place) out.title = out.place;
    else if(out.source) out.title = "Something from " + out.source;
  }
  if(out.title.length > 90){
    out.title = out.title.slice(0,90).replace(/\s+\S*$/,"") + "…";
  }

  /* 8. whatever prose is left becomes the note — minus the lines whose whole
        job was to carry the location, which is already its own field */
  var placeLc = out.place.toLowerCase();
  var rest = lines.filter(function(l){
    if(/^\u{1F4CD}/u.test(l)) return false;
    var bare = l.replace(/^[\p{Extended_Pictographic}️‍\s]+/u,"").replace(/[\s,.;:|-]+$/,"").toLowerCase();
    return !(placeLc && bare === placeLc);
  });
  out.note = rest.join(" ").replace(/\s+/g," ").trim();
  if(out.note.length > 320){
    out.note = out.note.slice(0,320).replace(/\s+\S*$/,"") + "…";
  }
  return out;
}

/* ===================== document template ===================== */

function stateJson(state){
  return JSON.stringify(state).replace(/</g,"\\u003c");
}

function renderDocument(state){
  var styleEl  = document.getElementById("app-style");
  var scriptEl = document.getElementById("app-script");
  var css = styleEl ? styleEl.textContent : "";
  var js  = scriptEl ? scriptEl.textContent : "";
  return '<!doctype html>\n<html lang="en">\n<head>\n' +
    '<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
    '<title>' + esc(TITLE) + '</title>\n' +
    FONT_LINKS + '\n' +
    '<style id="app-style">' + css + '</style>\n' +
    '</head>\n<body>\n' +
    '<div id="root"></div>\n' +
    '<script id="app-state" type="application/json">' + stateJson(state) + '<\/script>\n' +
    '<script id="app-script">' + js + '<\/script>\n' +
    '</body>\n</html>';
}

/* ===================== persistence ===================== */

function readIsland(){
  var el = document.getElementById("app-state");
  if(!el) return null;
  try{ return JSON.parse(el.textContent || "{}"); }catch(e){ return null; }
}

function loadState(){
  var island = readIsland() || {v:1, items:[], savedAt:0};
  if(!Array.isArray(island.items)) island.items = [];

  /* a local-only copy can be ahead of the page when the viewer has no write access */
  var localRaw = lsGet("sl.state","");
  if(localRaw){
    try{
      var local = JSON.parse(localRaw);
      if(local && Array.isArray(local.items) && (local.savedAt||0) > (island.savedAt||0)){
        return local;
      }
    }catch(e){}
  }
  return island;
}

function persistLocal(){
  lsSet("sl.state", JSON.stringify(STATE));
}

function publishErrorMessage(code){
  switch(code){
    case "rate_limited":   return "Saving too fast. Give it a few seconds and try again.";
    case "too_large":      return "This list has outgrown one page. Retire a few done items to keep saving.";
    case "invalid_content":return "That change couldn't be saved. Reload the page and try again.";
    default:               return "Couldn't reach the server. Your change is kept on this device only.";
  }
}

function goReadOnly(){
  READONLY = true;
  renderAll();
  toast("You're reading someone else's list. Ask them for edit access to add to it.");
}

/* Applies a change to the shared list. In artifact mode the page republishes
   itself and every open view reloads to the new version. */
function commit(mutate, okMessage){
  if(READONLY){ toast("This view is read-only."); return; }
  var next = clone(STATE);
  mutate(next);
  next.savedAt = Date.now();

  if(MODE !== "artifact" || !API){
    STATE = next;
    persistLocal();
    renderAll();
    if(okMessage) toast(okMessage);
    return;
  }

  setBusy(true);
  try{ sessionStorage.setItem("sl.draft", JSON.stringify(readIntake())); }catch(e){}

  API.publish(renderDocument(next)).then(function(){
    /* this view is about to reload to the version we just wrote */
  })["catch"](function(err){
    setBusy(false);
    var code = (err && err.code) || "upstream_error";
    if(code === "conflict"){
      toast("Someone saved first — loading their version.");
      return;
    }
    if(code === "not_writer" || code === "not_granted" || code === "not_declared" ||
       code === "consent_required" || code === "capability_disabled" || code === "capability_removed"){
      goReadOnly();
      return;
    }
    /* keep the change on this device so nothing the viewer typed is lost */
    STATE = next;
    persistLocal();
    renderAll();
    toast(publishErrorMessage(code));
  });
}

/* ===================== rendering ===================== */

function stats(){
  var items = STATE.items;
  var someday = items.filter(function(i){ return i.status === "someday"; });
  var done = items.filter(function(i){ return i.status === "done"; });
  var dropped = items.filter(function(i){ return i.status === "dropped"; });
  var resolved = done.length + dropped.length;
  var rate = items.length ? Math.round((done.length / items.length) * 100) : 0;
  var oldest = 0, intending = 0;
  someday.forEach(function(i){
    var d = daysSince(i.at);
    intending += d;
    if(d > oldest) oldest = d;
  });
  return {
    total:items.length, someday:someday.length, done:done.length,
    dropped:dropped.length, resolved:resolved, rate:rate,
    oldest:oldest, intending:intending
  };
}

function ledgerHtml(){
  var s = stats();
  var grim = s.total >= 4 && s.rate < 25;
  return '' +
    '<dl class="ledger">' +
      '<div class="stat"><dt>On the list</dt><dd>' + s.someday + '</dd></div>' +
      '<div class="stat"><dt>Actually done</dt><dd>' + s.done + '</dd></div>' +
      '<div class="stat' + (grim ? " is-grim" : "") + '"><dt>Follow-through</dt><dd>' + s.rate + '<small>%</small></dd></div>' +
      '<div class="stat"><dt>Longest pending</dt><dd>' + s.oldest + '<small> ' + plural(s.oldest,"day","days") + '</small></dd></div>' +
      '<div class="stat"><dt>Days of intending</dt><dd>' + s.intending.toLocaleString() + '</dd></div>' +
    '</dl>';
}

function taglineFor(){
  var s = stats();
  if(s.total === 0) return "A running record of everything we swear we'll get to. It starts honest and stays that way.";
  if(s.done === 0)  return "Every plan we've made so far, still waiting. Not one of them has happened yet.";
  if(s.rate < 20)   return "Everything we swear we'll get to, filed and quietly aging. " + s.done + " of " + s.total + " have survived contact with a calendar.";
  if(s.rate < 60)   return "Everything we swear we'll get to. " + s.done + " down, " + s.someday + " still pretending.";
  return "Everything we swear we'll get to — and, improbably, mostly do. " + s.done + " of " + s.total + " done.";
}

}

function catOptions(sel){
  var html = '<option value=""' + (sel === "" ? " selected" : "") + '>Unsorted</option>';
  CATEGORIES.forEach(function(c){
    html += '<option value="' + attr(c.key) + '"' + (sel === c.key ? " selected" : "") + '>' + esc(c.label) + '</option>';
  });
  return html;
}

function visibleItems(){
  var q = VIEW.q.trim().toLowerCase();
  var list = STATE.items.filter(function(i){
    if(VIEW.tab !== "all" && i.status !== VIEW.tab) return false;
    if(VIEW.cat === "__none"){ if(i.category) return false; }
    else if(VIEW.cat && (i.category || "") !== VIEW.cat) return false;
    if(q){
      var hay = [i.title, i.note, i.place, i.cost, i.when, i.by, (i.tags||[]).join(" ")].join(" ").toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  list.sort(function(a,b){
    if(VIEW.sort === "old")  return a.at - b.at;
    if(VIEW.sort === "az")   return String(a.title).localeCompare(String(b.title));
    if(VIEW.sort === "cat")  return String(CAT_LABEL[a.category||""]).localeCompare(String(CAT_LABEL[b.category||""])) || (b.at - a.at);
    return b.at - a.at;
  });
  return list;
}

function toolbarHtml(){
  var s = stats();
  function tab(key,label,count){
    return '<button class="tab" role="tab" type="button" data-tab="' + attr(key) + '" aria-selected="' +
      (VIEW.tab === key ? "true" : "false") + '">' + esc(label) + '<b>' + count + '</b></button>';
  }
  var html = '<div class="toolbar">' +
    '<div class="tabs" role="tablist" aria-label="Filter by status">' +
      tab("someday","Someday",s.someday) +
      tab("done","We did it",s.done) +
      tab("dropped","Let go",s.dropped) +
      tab("all","Everything",s.total) +
    '</div>' +
    '<div class="tools">' +
      '<input type="text" id="q" value="' + attr(VIEW.q) + '" placeholder="Search the pile" aria-label="Search">' +
      '<select id="sort" aria-label="Sort">' +
        '<option value="new"' + (VIEW.sort === "new" ? " selected" : "") + '>Newest first</option>' +
        '<option value="old"' + (VIEW.sort === "old" ? " selected" : "") + '>Most neglected</option>' +
        '<option value="cat"' + (VIEW.sort === "cat" ? " selected" : "") + '>By kind</option>' +
        '<option value="az"' + (VIEW.sort === "az" ? " selected" : "") + '>A–Z</option>' +
      '</select>' +
    '</div>' +
  '</div>';

  /* only offer categories that are actually in use */
  var used = {};
  STATE.items.forEach(function(i){ used[i.category || ""] = (used[i.category || ""] || 0) + 1; });
  var keys = Object.keys(used);
  if(keys.length > 1){
    html += '<div class="cats">';
    html += '<button class="catbtn" type="button" data-cat="__all" aria-pressed="' + (VIEW.cat === "" ? "true" : "false") + '">All kinds</button>';
    CATEGORIES.forEach(function(c){
      if(!used[c.key]) return;
      html += '<button class="catbtn" type="button" data-cat="' + attr(c.key) + '" aria-pressed="' +
        (VIEW.cat === c.key ? "true" : "false") + '">' + esc(c.label) + ' <b>' + used[c.key] + '</b></button>';
    });
    if(used[""]){
      html += '<button class="catbtn" type="button" data-cat="__none" aria-pressed="' +
        (VIEW.cat === "__none" ? "true" : "false") + '">Unsorted <b>' + used[""] + '</b></button>';
    }
    html += '</div>';
  }
  return html;
}

function cardHtml(item){
  var days = daysSince(item.at);
  var d = decayOf(days);
  var url = safeUrl(item.url);
  var mine = myName();
  var joined = (item.in || []).indexOf(mine) !== -1 && mine !== "";

  var ageLine;
  if(item.status === "done"){
    var took = Math.max(0, Math.floor(((item.statusAt || item.at) - item.at) / DAY));
    ageLine = took === 0 ? "same day, somehow" : "took " + took + " " + plural(took,"day","days");
  } else if(item.status === "dropped"){
    ageLine = "let go after " + days + " " + plural(days,"day","days");
  } else {
    ageLine = "day " + days + " · " + d.word;
  }

  var facts = "";
  if(item.place) facts += '<li><i>Where</i>' + esc(item.place) + '</li>';
  if(item.cost)  facts += '<li><i>Cost</i>' + esc(item.cost) + '</li>';
  if(item.when)  facts += '<li><i>When</i>' + esc(item.when) + '</li>';

  var others = (item.in || []).filter(function(n){ return n && n !== item.by; });

  var acts = "";
  if(!READONLY){
    if(item.status === "someday"){
      acts += '<button class="act yes" type="button" data-do="done" data-id="' + attr(item.id) + '">We did it</button>';
      acts += '<button class="act" type="button" data-do="join" data-id="' + attr(item.id) + '" aria-pressed="' + (joined ? "true" : "false") + '">' + (joined ? "I’m in ✓" : "I’m in") + '</button>';
      acts += '<button class="act no" type="button" data-do="dropped" data-id="' + attr(item.id) + '">Let it go</button>';
    } else {
      acts += '<button class="act" type="button" data-do="someday" data-id="' + attr(item.id) + '">Back on the list</button>';
    }
    acts += '<button class="act no" type="button" data-do="delete" data-id="' + attr(item.id) + '" aria-label="Delete">Delete</button>';
  }

  var stamp = "";
  if(item.status === "done")    stamp = '<span class="stamp' + (item.justStamped ? " slam" : "") + '">Actually did it</span>';
  if(item.status === "dropped") stamp = '<span class="stamp let-go' + (item.justStamped ? " slam" : "") + '">Let go</span>';

  var titleHtml = url
    ? '<a href="' + attr(url) + '" target="_blank" rel="noopener noreferrer">' + esc(item.title) + '</a>'
    : esc(item.title);

  return '' +
  '<article class="card" data-status="' + attr(item.status) + '" data-decay="' + d.tier + '">' +
    '<div class="decay" aria-hidden="true"></div>' +
    '<div class="card-in">' +
      '<div class="card-top">' +
        '<span class="chip">' + esc(CAT_LABEL[item.category || ""] || "Unsorted") + '</span>' +
        '<span class="age">' + esc(ageLine) + '</span>' +
      '</div>' +
      '<h3>' + titleHtml + '</h3>' +
      (item.note ? '<p class="note">' + esc(item.note) + '</p>' : "") +
      (facts ? '<ul class="facts">' + facts + '</ul>' : "") +
      ((item.tags && item.tags.length) ? '<div class="tags">' + item.tags.map(function(t){ return '<span>#' + esc(t) + '</span>'; }).join("") + '</div>' : "") +
      (url ? '<a class="src" href="' + attr(url) + '" target="_blank" rel="noopener noreferrer">' + esc(item.source || hostOf(url) || "Link") + ' ↗</a>' : "") +
      '<div class="card-foot">' +
        '<span class="by">' + esc(item.by ? "added by " + item.by : "added by someone") +
          (others.length ? " · also " + esc(others.join(", ")) : "") + '</span>' +
        '<div class="acts">' + acts + '</div>' +
      '</div>' +
    '</div>' +
    stamp +
  '</article>';
}

function emptyHtml(){
  var s = stats();
  if(s.total === 0){
    return '<div class="empty"><p class="big">Nothing here yet.</p>' +
      '<p>Statistically, this is the best the list will ever look.</p></div>';
  }
  if(VIEW.tab === "done" && s.done === 0){
    return '<div class="empty"><p class="big">No entries.</p><p>We both knew that.</p></div>';
  }
  if(VIEW.tab === "dropped" && s.dropped === 0){
    return '<div class="empty"><p class="big">Nothing let go.</p><p>Admirable. Or avoidant.</p></div>';
  }
  return '<div class="empty"><p class="big">Nothing matches.</p><p>Try a different filter.</p></div>';
}

function startedLabel(){
  if(!STATE.items.length) return "today";
  var first = STATE.items.reduce(function(a,b){ return a.at < b.at ? a : b; });

    return new Date(first.at).toLocaleDateString(undefined,{month:"long", year:"numeric"});

function footNote(){
  var s = stats();
  if(s.total === 0) return "Add the first one.";
  if(s.someday === 0) return "Nothing pending. Suspicious.";
  var avg = Math.round(s.intending / s.someday);
  return "The average unfinished plan here is " + avg + " " + plural(avg,"day","days") + " old.";

/* ===================== intake form plumbing ===================== */

function readIntake(){
  function val(id){ var el = document.getElementById(id); return el ? el.value : ""; }
  return {
    paste: val("paste"), title: val("f-title"), place: val("f-place"),
    cat: val("f-cat"), cost: val("f-cost"), when: val("f-when"),
    note: val("f-note"), url: val("f-url")
  };
}

function writeIntake(d){
  function set(id,v){ var el = document.getElementById(id); if(el && v != null) el.value = v; }
  set("paste", d.paste); set("f-title", d.title); set("f-place", d.place);
  set("f-cat", d.cat); set("f-cost", d.cost); set("f-when", d.when);
  set("f-note", d.note); set("f-url", d.url);
}

function clearIntake(){
  writeIntake({paste:"",title:"",place:"",cat:"",cost:"",when:"",note:"",url:""});
  setParseNote("", "");
  try{ sessionStorage.removeItem("sl.draft"); }catch(e){}
}

function restoreDraft(){
  var raw;
  try{ raw = sessionStorage.getItem("sl.draft"); }catch(e){ return; }
  if(!raw) return;
  try{
    var d = JSON.parse(raw);
    var any = Object.keys(d).some(function(k){ return String(d[k] || "").trim(); });
    if(any) writeIntake(d);
  }catch(e){}
}

function setParseNote(msg, kind){
  var el = document.getElementById("parse-note");
  if(!el) return;
  el.textContent = msg;
  el.className = "parse-note" + (kind ? " " + kind : "");
}

function doRead(){
  var el = document.getElementById("paste");
  if(!el) return;
  var text = el.value;
  if(!text.trim()){
    setParseNote("Paste something first — a link, a caption, or both.", "miss");
    return;
  }
  var p = parsePaste(text);
  var cur = readIntake();
  /* never clobber something the viewer typed by hand */
  writeIntake({
    paste: cur.paste,
    title: cur.title || p.title,
    place: cur.place || p.place,
    cat:   cur.cat   || p.category,
    cost:  cur.cost  || p.cost,
    when:  cur.when  || p.when,
    note:  cur.note  || p.note,
    url:   cur.url   || p.url
  });
  PARSED_ONCE = true;

  var found = [];
  if(p.title) found.push("a name");
  if(p.place) found.push("a place");
  if(p.cost) found.push("a price");
  if(p.when) found.push("a date");
  if(p.category) found.push("a kind");
  if(p.url) found.push(p.source ? ("the " + p.source + " link") : "a link");

  var dupe = p.url ? STATE.items.filter(function(i){ return i.url && i.url === p.url; })[0] : null;
  if(dupe){
    setParseNote("Already on the list — " + (dupe.by || "someone") + " saved it " + daysSince(dupe.at) + " days ago.", "miss");
    return;
  }
  if(found.length){
    setParseNote("Filled in " + found.join(", ") + ". Fix anything I got wrong.", "hit");
  } else {
    setParseNote("Couldn't make much of that. Fill it in yourself.", "miss");
  }
  var tagsHolder = document.getElementById("paste");
  if(tagsHolder) tagsHolder.dataset.tags = (p.tags || []).join(",");
}

function doAdd(){
  var d = readIntake();
  var nameEl = document.getElementById("f-name");
  var name = nameEl ? nameEl.value.trim() : "";
  if(name) lsSet("sl.name", name);

  if(!d.title.trim() && d.paste.trim() && !PARSED_ONCE){
    doRead();
    d = readIntake();
  }
  if(!d.title.trim()){
    setParseNote("Give it a name at least.", "miss");
    var t = document.getElementById("f-title");
    if(t) t.focus();
    return;
  }
  if(!name){
    setParseNote("Sign your name below so we know whose idea this was.", "miss");
    if(nameEl) nameEl.focus();
    return;
  }

  var pasteEl = document.getElementById("paste");
  var tags = (pasteEl && pasteEl.dataset.tags) ? pasteEl.dataset.tags.split(",").filter(Boolean) : [];
  var url = safeUrl(d.url);

  var item = {
    id: uid(),
    title: d.title.trim(),
    note: d.note.trim(),
    place: d.place.trim(),
    cost: d.cost.trim(),
    when: d.when.trim(),
    category: d.cat,
    url: url,
    source: url ? detectSource(url) : "",
    tags: tags,
    by: name,
    at: Date.now(),
    status: "someday",
    statusAt: 0,
    "in": [name]
  };

  clearIntake();
  commit(function(next){ next.items.unshift(item); }, "Pinned. Now never do it.");
}

/* ===================== item actions ===================== */

function setStatus(id, status){
  commit(function(next){
    next.items.forEach(function(i){
      if(i.id === id){
        i.status = status;
        i.statusAt = Date.now();
        i.justStamped = true;
      }
    });
  }, status === "done" ? "Stamped. Genuinely surprising." : status === "dropped" ? "Let go. Honest of you." : "Back on the pile.");
}

function toggleJoin(id){
  var name = myName();
  if(!name){
    toast("Sign your name in the intake slip first.");
    var el = document.getElementById("f-name");
    if(el) el.focus();
    return;
  }
  commit(function(next){
    next.items.forEach(function(i){
      if(i.id !== id) return;
      i["in"] = i["in"] || [];
      var at = i["in"].indexOf(name);
      if(at === -1) i["in"].push(name); else i["in"].splice(at,1);
    });
  }, null);
}

function removeItem(id){
  var item = STATE.items.filter(function(i){ return i.id === id; })[0];
  if(!item) return;
  if(!window.confirm('Delete "' + item.title + '" for everyone?')) return;
  commit(function(next){
    next.items = next.items.filter(function(i){ return i.id !== id; });
  }, "Deleted.");
}

function exportCsv(){
  if(!DL) return;
  var head = ["title","status","kind","where","cost","when","note","link","added by","added","days pending"];
  var rows = STATE.items.map(function(i){
    return [
      i.title, i.status, CAT_LABEL[i.category || ""] || "", i.place, i.cost, i.when,
      i.note, i.url, i.by, new Date(i.at).toISOString().slice(0,10),
      i.status === "someday" ? String(daysSince(i.at)) : ""
    ];
  });
  var csv = [head].concat(rows).map(function(r){
    return r.map(function(c){ return '"' + String(c == null ? "" : c).replace(/"/g,'""') + '"'; }).join(",");
  }).join("\n");
  DL.save({filename:"someday-list.csv", data:csv})["catch"](function(){
    toast("Export cancelled.");
  });
}

/* ===================== events ===================== */

function on(id, ev, fn){
  var el = document.getElementById(id);
  if(el) el.addEventListener(ev, fn);
}

function wireEvents(){
  on("read-btn","click", doRead);
  on("add-btn","click", doAdd);
  on("clear-btn","click", function(){ clearIntake(); });

  on("f-name","change", function(e){ lsSet("sl.name", e.target.value.trim()); });

  var paste = document.getElementById("paste");
  if(paste){
    paste.addEventListener("paste", function(){
      /* read it a tick after the text actually lands */
      setTimeout(function(){
        var cur = readIntake();
        if(!cur.title.trim()) doRead();
      }, 30);
    });
  }

  on("q","input", function(e){ VIEW.q = e.target.value; softRerender(); });
  on("sort","change", function(e){ VIEW.sort = e.target.value; softRerender(); });

  /* #root outlives every re-render, so its delegated handler is attached once */
  var root = document.getElementById("root");
  if(root.dataset.wired) return;
  root.dataset.wired = "1";
  root.addEventListener("click", function(e){
    var tabBtn = e.target.closest("[data-tab]");
    if(tabBtn){ VIEW.tab = tabBtn.getAttribute("data-tab"); softRerender(); return; }

    var catBtn = e.target.closest("[data-cat]");
    if(catBtn){
      var c = catBtn.getAttribute("data-cat");
      if(c === "__all") VIEW.cat = "";
      else VIEW.cat = (VIEW.cat === c) ? "" : c;
      softRerender();
      return;
    }

    var act = e.target.closest("[data-do]");
    if(act){
      var id = act.getAttribute("data-id");
      var what = act.getAttribute("data-do");
      if(what === "delete") removeItem(id);
      else if(what === "join") toggleJoin(id);
      else setStatus(id, what);
    }
  });
}

/* re-render without touching the intake slip the viewer may be typing in */
function softRerender(){
  var draft = readIntake();
  var focusId = document.activeElement ? document.activeElement.id : "";
  var selStart = null, selEnd = null;
  var ae = document.activeElement;
  if(ae && (ae.id === "q") && typeof ae.selectionStart === "number"){
    selStart = ae.selectionStart; selEnd = ae.selectionEnd;
  }
  renderAll();
  writeIntake(draft);
  if(focusId){
    var back = document.getElementById(focusId);
    if(back){
      back.focus();
      if(selStart !== null && typeof back.setSelectionRange === "function"){
        try{ back.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function setBusy(v){
  BUSY = v;
  var btn = document.getElementById("add-btn");
  if(btn){
    btn.disabled = v;
    btn.textContent = v ? "Saving…" : "Pin it to the list";
  }
}

var toastTimer = null;
function toast(msg){
  if(!msg) return;
  var el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, 3200);
}

/* ===================== boot ===================== */

STATE = loadState();
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", renderAll);
} else {
  renderAll();
}

/* Capabilities answer later, never during this first run. */
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("artifact").then(function(ns){
    if(!ns) return;
    API = ns;
    MODE = "artifact";
    renderAll();
  })["catch"](function(){});

  window.claude.use("downloads").then(function(ns){
    if(!ns) return;
    DL = ns;
    renderFootActions();
  })["catch"](function(){});
}
})();
</script>
